packaging_format = 2
id = "oscar"
name = "Oscar, mission HSE"
description.fr = "Jeu de prévention HSE avec deux niveaux et un tableau d’honneur commun"
description.en = "A short workplace safety platform game with a shared honour board"
version = "1.0.0~ynh1"
maintainers = ["Onyx"]

[upstream]
license = "LicenseRef-Proprietary"
license_url = "https://github.com/arcenal-coder/oscar_ynh/blob/preview/LICENSE"
code = "https://github.com/arcenal-coder/oscar_ynh"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap = false
sso = false
disk = "150M"
ram.build = "200M"
ram.runtime = "100M"

[install.domain]
type = "domain"

[install.path]
type = "path"
default = "/oscar"

[resources.system_user]

[resources.install_dir]
group = "www-data:rx"

[resources.data_dir]
group = "__APP__:---"

[resources.permissions]
main.url = "/"
main.allowed = ["visitors", "all_users"]
main.auth_header = false

[resources.ports]

[resources.apt]
packages = ["python3", "python3-venv", "python3-pip", "rsync"]
